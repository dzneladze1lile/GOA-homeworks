<!DOCTYPE html>
<html>
    <head>
        <title>classwork</title>
    </head>
    <body>
        <script>
            let myList = [1, 2, 3, 4, 5];
            myList.push("YourName");
            console.log(myList);

            myList.pop();
            console.log(myList);

            let joinedString = myList.join(" ");
            console.log(joinedString);

            let slicedList = myList.slice(0, 4);
            console.log(slicedList);

            let secondList = ["a", "b", "c"];
            let finalList = myList.concat(secondList);
            console.log(finalList);
        </script>
    </body>
</html>
