<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Cart</title>
    <link rel="stylesheet" href="classwork.css">
</head>
<body>
    <h1>Product Cart</h1>
    
    <form>
        <input type="text" name="product" required placeholder="Product name"><br><br>
        <input type="number" name="quantity" required min="1" placeholder="Product quantity"><br><br>
        <input type="number" name="price" required min="0" step="0.01" placeholder="Enter price"><br><br>
        <button type="submit">Add Product</button>
    </form>
    <br><br>
    
    <div id="productDiv"></div>

    <script src="classwork.js"></script>
</body>
</html>
